<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EPC Multi-Agent Command Center | Azure AI Platform</title>
  <meta name="description" content="Real-time EPC project intelligence powered by Azure AI multi-agent orchestration">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <!-- Sidebar -->
  <nav id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-name">EPC Command</span>
        <span class="brand-sub">Azure AI Platform</span>
      </div>
    </div>

    <div class="nav-section">
      <div class="nav-label">NAVIGATION</div>
      <a class="nav-item active" data-view="dashboard" href="#dashboard">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        <span>Dashboard</span>
      </a>
      <a class="nav-item" data-view="graph" href="#graph">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="3"/><circle cx="19" cy="6" r="3"/><circle cx="19" cy="18" r="3"/><line x1="7.5" y1="10.5" x2="16.5" y2="7.5"/><line x1="7.5" y1="13.5" x2="16.5" y2="16.5"/></svg>
        <span>Knowledge Graph</span>
      </a>
      <a class="nav-item" data-view="agents" href="#agents">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a5 5 0 0 1 5 5v2a5 5 0 0 1-10 0V7a5 5 0 0 1 5-5z"/><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/></svg>
        <span>Agent Activity</span>
      </a>
      <a class="nav-item" data-view="workflows" href="#workflows">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <span>Workflows</span>
      </a>
      <a class="nav-item" data-view="hitl" href="#hitl">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><polyline points="17 11 19 13 23 9"/></svg>
        <span>HITL Queue</span>
        <span id="hitl-badge" class="badge">0</span>
      </a>
      
      <div style="margin: 24px 0 8px 16px; font-size: 0.65rem; font-weight: 700; color: rgba(255,255,255,0.4); letter-spacing: 0.05em; text-transform: uppercase">Executive</div>
      <a href="#simulations" class="nav-item" data-view="simulations"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 19 21 12 17 5 21 12 2"/></svg>What-If Simulations <span class="badge" style="background:var(--accent);color:#fff">NEW</span></a>
    </div>

    <div class="nav-section sidebar-footer">
      <div class="nav-label">SYSTEM</div>
      <div class="system-info">
        <div class="system-item">
          <span class="dot dot-green"></span>
          <span>Azure AI Foundry</span>
        </div>
        <div class="system-item">
          <span class="dot dot-green"></span>
          <span>Cosmos DB Gremlin</span>
        </div>
        <div class="system-item">
          <span class="dot dot-green"></span>
          <span>Azure OpenAI (GPT-4o)</span>
        </div>
        <div class="system-item">
          <span class="dot dot-blue"></span>
          <span>Mode: Demo (Mock)</span>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main id="main-content">
    <!-- Header -->
    <header id="top-header">
      <div class="header-left">
        <h1 id="page-title">Dashboard</h1>
        <span class="header-project">LNG Train 4</span>
      </div>
      <div class="header-right">
        <div class="agent-query-box">
          <input type="text" id="agent-query-input" placeholder="Ask the AI agents anything..." />
          <button id="agent-query-btn" title="Send">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Views -->
    <div id="view-dashboard" class="view active"></div>
    <div id="view-graph" class="view"></div>
    <div id="view-agents" class="view"></div>
    <div id="view-workflows" class="view"></div>
    <div id="view-hitl" class="view"></div>
    <div id="view-simulations" class="view"></div>

    <!-- Agent Response Modal -->
    <div id="agent-modal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h3>🧠 Agent Response</h3>
          <button class="modal-close" id="modal-close">&times;</button>
        </div>
        <div id="agent-modal-body" class="modal-body"></div>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="/static/js/app.js"></script>
  <script src="/static/js/dashboard.js"></script>
  <script src="/static/js/graph-viz.js"></script>
  <script src="/static/js/agent-feed.js"></script>
  <script src="/static/js/workflow-monitor.js"></script>
  <script src="/static/js/hitl-queue.js"></script>
  <script src="/static/js/simulations_v2.js"></script>
</body>
</html>
